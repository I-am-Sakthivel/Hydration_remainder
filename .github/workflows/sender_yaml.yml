name: "Sender"
on:
  workflow_dispatch:
env:
  my_email: ${{ secrets.my_email }}
  password: ${{ secrets.password }}

jobs:
  send:
    runs-on: ubuntu-latest
    permissions: 
      issues: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install python-dotenv

      - name: Run the script
        run: |
          python3 mail.py
